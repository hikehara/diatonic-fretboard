<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ダイアトニック指板</title>
<meta name="description" content="ギター指板上でダイアトニックコードのルート位置を度数で確認するツール">
<meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f1e1d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="指板コード">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
--bg:#faf9f5;--text-primary:#1f1e1d;--text-secondary:#5e5d59;--text-muted:#8d8b84;
--border:rgba(31,30,29,.15);--border-strong:rgba(31,30,29,.3);--border-stronger:rgba(31,30,29,.45);
--bg-neutral:rgba(31,30,29,.05);--bg-accent:#e6f1fb;--text-accent:#185fa5;--border-accent:#378add;--bg-accent-muted:rgba(55,138,221,.1);
--coral-f:#FAECE7;--coral-s:#993C1D;--coral-t:#712B13;
--purple-f:#EEEDFE;--purple-s:#534AB7;--purple-t:#3C3489;
--blue-f:#E6F1FB;--blue-s:#185FA5;--blue-t:#0C447C;
--gray-f:#F1EFE8;--gray-s:#5F5E5A;--gray-t:#444441;
--lime-f:#E4F5C8;--lime-s:#5E9A1A;--lime-t:#2F5208;
color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
--bg:#1f1e1d;--text-primary:#f0eee6;--text-secondary:#b4b2a9;--text-muted:#888780;
--border:rgba(240,238,230,.15);--border-strong:rgba(240,238,230,.3);--border-stronger:rgba(240,238,230,.45);
--bg-neutral:rgba(240,238,230,.06);--bg-accent:#0c447c;--text-accent:#b5d4f4;--border-accent:#378add;--bg-accent-muted:rgba(55,138,221,.18);
--coral-f:#712B13;--coral-s:#F0997B;--coral-t:#FAECE7;
--purple-f:#3C3489;--purple-s:#AFA9EC;--purple-t:#EEEDFE;
--blue-f:#0C447C;--blue-s:#85B7EB;--blue-t:#E6F1FB;
--gray-f:#444441;--gray-s:#B4B2A9;--gray-t:#F1EFE8;
--lime-f:#4D7A10;--lime-s:#B5E06A;--lime-t:#F4FBE6;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text-primary)}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:16px;line-height:1.6;touch-action:manipulation;
padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 14px)}
main{max-width:640px;margin:0 auto}
h1{font-size:18px;font-weight:500;margin:0 0 12px}
button{font:inherit;font-size:14px;color:var(--text-primary);background:transparent;border:.5px solid var(--border-strong);border-radius:8px;padding:8px 6px;min-height:40px;cursor:pointer}
button:active{transform:scale(.98)}
select{font:inherit;font-size:16px;color:var(--text-primary);background:transparent;border:.5px solid var(--border-strong);border-radius:8px;padding:6px 10px;min-height:40px}
.row{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.seg{display:flex;gap:6px;margin:0 0 8px}
.seg button{flex:1;min-width:0}
.seg button.on{background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent)}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:6px}
.chip{display:flex;align-items:center;gap:6px;padding:8px;justify-content:flex-start;text-align:left;min-width:0}
.chip svg{flex-shrink:0}
.chip.on{border-color:var(--border-accent);background:var(--bg-accent-muted)}
.chip.wide{grid-column:1/-1}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--text-secondary);margin:0 0 10px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.note{font-size:12px;color:var(--text-muted);margin:0 0 6px}
#cap{font-size:13px;color:var(--text-secondary);margin:2px 0 8px}
svg text{font-family:inherit}
.ts{fill:var(--text-secondary);font-size:12px}
.th{fill:var(--text-primary);font-size:14px;font-weight:500}
.c-coral>circle,.c-coral>rect{fill:var(--coral-f);stroke:var(--coral-s)}.c-coral>text{fill:var(--coral-t)}
.c-purple>circle,.c-purple>rect{fill:var(--purple-f);stroke:var(--purple-s)}.c-purple>text{fill:var(--purple-t)}
.c-blue>circle,.c-blue>rect{fill:var(--blue-f);stroke:var(--blue-s)}.c-blue>text{fill:var(--blue-t)}
.c-gray>circle,.c-gray>rect{fill:var(--gray-f);stroke:var(--gray-s)}.c-gray>text{fill:var(--gray-t)}
.c-lime>circle,.c-lime>rect{fill:var(--lime-f);stroke:var(--lime-s)}.c-lime>text{fill:var(--lime-t)}
circle.c-coral{fill:var(--coral-f);stroke:var(--coral-s)}circle.c-purple{fill:var(--purple-f);stroke:var(--purple-s)}
circle.c-blue{fill:var(--blue-f);stroke:var(--blue-s)}circle.c-gray{fill:var(--gray-f);stroke:var(--gray-s)}circle.c-lime{fill:var(--lime-f);stroke:var(--lime-s)}
</style>
</head>
<body>
<main>
<h1>ダイアトニック指板</h1>
<div class="row">
<label for="key" style="font-size:14px;color:var(--text-secondary)">キー</label>
<select id="key" style="flex:1"></select>
</div>
<div class="seg" id="mode"><button data-v="6">6弦ルート</button><button data-v="5">5弦ルート</button></div>
<div class="seg" id="type"><button data-v="3">3和音</button><button data-v="4">4和音（セブンス）</button></div>
<svg id="fb" width="100%" viewBox="0 0 380 246" role="img" aria-label="ダイアトニックコードのルート位置を示した横向きの指板"><g id="g"></g></svg>
<p id="cap"></p>
<div class="legend">
<span><svg width="12" height="12" aria-hidden="true"><circle class="c-coral" cx="6" cy="6" r="5" stroke-width="1"/></svg>Ⅰ（キーのルート）</span>
<span><svg width="12" height="12" aria-hidden="true"><circle class="c-purple" cx="6" cy="6" r="5" stroke-width="1"/></svg>メジャーコード</span>
<span><svg width="12" height="12" aria-hidden="true"><circle class="c-blue" cx="6" cy="6" r="5" stroke-width="1"/></svg>マイナーコード（Ⅱm・Ⅲm）</span>
<span><svg width="12" height="12" aria-hidden="true"><circle class="c-lime" cx="6" cy="6" r="5" stroke-width="1"/></svg>Ⅵm</span>
<span><svg width="12" height="12" aria-hidden="true"><circle class="c-gray" cx="6" cy="6" r="5" stroke-width="1"/></svg>m(♭5)</span>
</div>
<p class="note">複数タップで同時に強調、もう一度タップで解除</p>
<div class="seg" id="fn"><button data-g="T">T</button><button data-g="SD">SD</button><button data-g="D">D</button><button data-g="clr">すべて解除</button></div>
<div class="chips" id="chips"></div>
</main>
<script>
const OPEN=[4,11,7,2,9,4];
const ABS=[24,19,15,10,5,0];
const LET=['C','D','E','F','G','A','B'],LPC=[0,2,4,5,7,9,11];
const KEYS=[['C',0,0],['D♭',1,-1],['D',1,0],['E♭',2,-1],['E',2,0],['F',3,0],['F♯',3,1],['G',4,0],['A♭',5,-1],['A',5,0],['B♭',6,-1],['B',6,0]];
const STEP=[0,2,4,5,7,9,11];
const R3=['Ⅰ','Ⅱm','Ⅲm','Ⅳ','Ⅴ','Ⅵm','Ⅶm-5'],R4=['ⅠM7','Ⅱm7','Ⅲm7','ⅣM7','Ⅴ7','Ⅵm7','Ⅶm7-5'];
const C3=['','m','m','','','m','m(♭5)'],C4=['M7','m7','m7','M7','7','m7','m7(♭5)'];
const RF3=['Ⅰ','Ⅱm','Ⅲm','Ⅳ','Ⅴ','Ⅵm','Ⅶm(♭5)'],RF4=['ⅠM7','Ⅱm7','Ⅲm7','ⅣM7','Ⅴ7','Ⅵm7','Ⅶm7(♭5)'];
const FN=['T','SD','T','SD','D','T','D'];
const GRP={T:[0,2,5],SD:[1,3],D:[4,6]};
const SKEY='diatonic-fretboard-state';
const st={key:0,mode:'6',type:'3',sel:new Set()};
try{const s=JSON.parse(localStorage.getItem(SKEY)||'null');if(s){if(s.key>=0&&s.key<12)st.key=s.key;if(s.mode==='6'||s.mode==='5')st.mode=s.mode;if(s.type==='3'||s.type==='4')st.type=s.type;if(Array.isArray(s.sel))st.sel=new Set(s.sel.filter(x=>x>=0&&x<7));}}catch(e){}
function save(){try{localStorage.setItem(SKEY,JSON.stringify({key:st.key,mode:st.mode,type:st.type,sel:[...st.sel]}));}catch(e){}}
const sel=document.getElementById('key');
KEYS.forEach((k,i)=>{const o=document.createElement('option');o.value=i;o.textContent=k[0];sel.appendChild(o);});
sel.value=String(st.key);
sel.addEventListener('change',()=>{st.key=+sel.value;draw();});
function seg(id,k){const el=document.getElementById(id);el.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.v===st[k]));el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;st[k]=b.dataset.v;el.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));draw();});}
seg('mode','mode');seg('type','type');
document.getElementById('chips').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const s=+b.dataset.s;if(st.sel.has(s))st.sel.delete(s);else st.sel.add(s);draw();});
document.getElementById('fn').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const g=b.dataset.g;if(g==='clr'){st.sel.clear();}else{const m=GRP[g];const allOn=m.every(x=>st.sel.has(x));m.forEach(x=>allOn?st.sel.delete(x):st.sel.add(x));}draw();});
function cat(d){if(d===0)return'c-coral';if(d===3||d===4)return'c-purple';if(d===5)return'c-lime';if(d===6)return'c-gray';return'c-blue';}
function kpc(){const k=KEYS[st.key];return(LPC[k[1]]+k[2]+12)%12;}
function noteName(deg){const k=KEYS[st.key];const l=(k[1]+deg)%7;const t=(kpc()+STEP[deg])%12;let a=t-LPC[l];if(a>6)a-=12;if(a<-6)a+=12;return LET[l]+(a===1?'♯':a===-1?'♭':'');}
function draw(){
const four=st.type==='4',RL=four?R4:R3;
const rs=st.mode==='6'?5:4;
let r=((kpc()-OPEN[rs])%12+12)%12;if(r===0)r=12;
const start=Math.max(0,r-1),end=r+7;
const notes=[];
for(let i=0;i<6;i++)for(let f=start;f<=end;f++){const d=ABS[i]+f-(ABS[rs]+r);const m=((d%12)+12)%12;const deg=STEP.indexOf(m);if(deg<0)continue;notes.push({i,f,deg,root:m===0});}
const L=30,R=372,hasOpen=start===0,showNut=start<=1,openW=hasOpen?30:0,first=hasOpen?1:start,n=end-first+1,cw=(R-L-openW)/n,nut=L+openW;
const X=f=>f===0?L+openW/2:nut+(f-first+0.5)*cw;
const Y=i=>46+i*30;
const inl=[3,5,7,9,15,17,19,21];
let h='';
h+=`<text class="ts" x="${L}" y="18">← ナット側</text><text class="ts" x="${R}" y="18" text-anchor="end">ブリッジ側 →</text>`;
h+=`<rect x="${nut}" y="32" width="${R-nut}" height="178" fill="var(--bg-neutral)"/>`;
for(let f=first;f<=end;f++){if(inl.includes(f))h+=`<circle cx="${X(f)}" cy="121" r="4" fill="var(--border-strong)"/>`;if(f===12)h+=`<circle cx="${X(f)}" cy="91" r="4" fill="var(--border-strong)"/><circle cx="${X(f)}" cy="151" r="4" fill="var(--border-strong)"/>`;}
for(let k=0;k<=n;k++){const x=nut+k*cw;if(k===0&&showNut)h+=`<rect x="${x-2.5}" y="32" width="5" height="178" fill="var(--text-secondary)"/>`;else h+=`<line x1="${x}" y1="32" x2="${x}" y2="210" stroke="var(--border-stronger)" stroke-width="1"/>`;}
const sw=[0.6,0.8,1,1.3,1.6,2];
for(let i=0;i<6;i++){h+=`<line x1="${L}" y1="${Y(i)}" x2="${R}" y2="${Y(i)}" stroke="var(--text-muted)" stroke-width="${sw[i]}"/><text class="ts" x="2" y="${Y(i)}" dominant-baseline="central">${i+1}弦</text>`;}
for(let f=(hasOpen?0:first);f<=end;f++){const strong=inl.includes(f)||f===12;h+=`<text class="${strong?'th':'ts'}" x="${X(f)}" y="228" text-anchor="middle" dominant-baseline="central" style="font-size:12px">${f}</text>`;}
const any=st.sel.size>0;
notes.forEach(o=>{const dim=any&&!st.sel.has(o.deg);const cx=X(o.f),cy=Y(o.i);h+=`<g class="pill ${cat(o.deg)}" data-cx="${cx}" opacity="${dim?0.15:1}"><rect x="${cx-12}" y="${cy-11}" width="24" height="22" rx="11" stroke-width="${o.root?2:0.75}"/><text class="th" x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" style="font-size:12px">${RL[o.deg]}</text></g>`;});
document.getElementById('g').innerHTML=h;
document.querySelectorAll('#g g.pill').forEach(g=>{const t=g.querySelector('text'),rc=g.querySelector('rect');const meas=()=>{let w=0;try{w=t.getComputedTextLength();}catch(e){}return w||t.textContent.length*8;};let W=meas()+10;if(W>cw-4){t.style.fontSize='11px';t.style.letterSpacing='-0.4px';W=meas()+5;}W=Math.max(24,W);rc.setAttribute('width',W);rc.setAttribute('x',(+g.dataset.cx)-W/2);});
const kn=KEYS[st.key][0];
document.getElementById('cap').textContent=`キー${kn}：${rs+1}弦${r}F＝Ⅰ。オクターブ上のⅠは${rs-1}弦${r+2}Fと${rs}弦${r+7}F`;
const RF=four?RF4:RF3,CQ=four?C4:C3;
document.getElementById('chips').innerHTML=[0,1,2,3,4,5,6].map(d=>`<button class="chip${st.sel.has(d)?' on':''}${d===6?' wide':''}" data-s="${d}" aria-pressed="${st.sel.has(d)}"><svg width="12" height="12" aria-hidden="true"><circle class="${cat(d)}" cx="6" cy="6" r="5" stroke-width="1"/></svg><span style="font-weight:500;white-space:nowrap">${RF[d]}</span><span style="white-space:nowrap">${noteName(d)}${CQ[d]}</span><span style="margin-left:auto;color:var(--text-muted);font-size:12px">${FN[d]}</span></button>`).join('');
document.querySelectorAll('#fn button').forEach(b=>{const g=b.dataset.g;b.classList.toggle('on',g!=='clr'&&GRP[g].every(x=>st.sel.has(x)));});
save();
}
draw();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
</body>
</html>
