<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ダイアトニック指板</title>
<meta name="description" content="ギター指板上でダイアトニックコードのルート位置を度数で確認するツール">
<meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f1e1d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="指板コード">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
--bg:#faf9f5;--text-primary:#1f1e1d;--text-secondary:#5e5d59;--text-muted:#8d8b84;
--border:rgba(31,30,29,.15);--border-strong:rgba(31,30,29,.3);--border-stronger:rgba(31,30,29,.45);
--bg-neutral:rgba(31,30,29,.05);--bg-accent:#e6f1fb;--text-accent:#185fa5;--border-accent:#378add;--bg-accent-muted:rgba(55,138,221,.1);
--coral-f:#FAECE7;--coral-s:#993C1D;--coral-t:#712B13;
--purple-f:#EEEDFE;--purple-s:#534AB7;--purple-t:#3C3489;
--blue-f:#E6F1FB;--blue-s:#185FA5;--blue-t:#0C447C;
--gray-f:#F1EFE8;--gray-s:#5F5E5A;--gray-t:#444441;
--lime-f:#E4F5C8;--lime-s:#5E9A1A;--lime-t:#2F5208;
--ok-f:#DDF3E4;--ok-s:#2E8B57;--ok-t:#14532D;--ng-f:#FDE7E7;--ng-s:#C0392B;--ng-t:#7A1F16;
color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
--bg:#1f1e1d;--text-primary:#f0eee6;--text-secondary:#b4b2a9;--text-muted:#888780;
--border:rgba(240,238,230,.15);--border-strong:rgba(240,238,230,.3);--border-stronger:rgba(240,238,230,.45);
--bg-neutral:rgba(240,238,230,.06);--bg-accent:#0c447c;--text-accent:#b5d4f4;--border-accent:#378add;--bg-accent-muted:rgba(55,138,221,.18);
--coral-f:#712B13;--coral-s:#F0997B;--coral-t:#FAECE7;
--purple-f:#3C3489;--purple-s:#AFA9EC;--purple-t:#EEEDFE;
--blue-f:#0C447C;--blue-s:#85B7EB;--blue-t:#E6F1FB;
--gray-f:#444441;--gray-s:#B4B2A9;--gray-t:#F1EFE8;
--lime-f:#4D7A10;--lime-s:#B5E06A;--lime-t:#F4FBE6;
--ok-f:#14532D;--ok-s:#6FCF97;--ok-t:#DDF3E4;--ng-f:#5A1D17;--ng-s:#F1948A;--ng-t:#FDE7E7;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text-primary)}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:16px;line-height:1.6;touch-action:manipulation;
padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 14px)}
main{max-width:640px;margin:0 auto}
h1{font-size:18px;font-weight:500;margin:0 0 12px}
button{font:inherit;font-size:14px;color:var(--text-primary);background:transparent;border:.5px solid var(--border-strong);border-radius:8px;padding:8px 6px;min-height:40px;cursor:pointer}
button:active{transform:scale(.98)}
select{font:inherit;font-size:16px;color:var(--text-primary);background:transparent;border:.5px solid var(--border-strong);border-radius:8px;padding:6px 10px;min-height:40px}
.row{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.seg{display:flex;gap:6px;margin:0 0 8px}
.seg button{flex:1;min-width:0}
.seg button.on{background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent)}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:6px}
.chip{display:flex;align-items:center;gap:6px;padding:8px;justify-content:flex-start;text-align:left;min-width:0}
.chip svg{flex-shrink:0}
.chip.on{border-color:var(--border-accent);background:var(--bg-accent-muted)}
.chip.wide{grid-column:1/-1}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--text-secondary);margin:0 0 10px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.note{font-size:12px;color:var(--text-muted);margin:0 0 6px}
.fbhead{display:flex;justify-content:space-between;font-size:12px;color:var(--text-secondary);margin:4px 0 2px 30px}
.fbhead .hint{color:var(--text-muted)}
.fbwrap{display:flex;align-items:flex-start}
#lab{flex:0 0 30px}
.sc{flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:thin}
.sc svg{display:block}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px}
.top h1{margin:0}
#qz{flex:0 0 auto;padding:6px 14px;min-height:36px}
#qz.on{background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent)}
#scale{flex:0 0 auto;margin:0}
#scale button{flex:0 0 auto;padding:8px 10px}
#keyq{display:none;flex:1;font-size:16px;border:.5px solid var(--border-strong);border-radius:8px;padding:6px 10px;min-height:40px;line-height:26px}
#quiz{display:none;margin:0 0 10px}
.quiz #quiz{display:block}
.quiz #key{display:none}
.quiz #keyq{display:block}
.quiz #type,.quiz #lbl,.quiz #cap,.quiz .legend,.quiz .note,.quiz #fn,.quiz #chips{display:none}
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;margin:6px 0}
.qhead .score{font-size:12px;color:var(--text-secondary);white-space:nowrap}
.ans{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ans button.ok{background:var(--ok-f);border-color:var(--ok-s);color:var(--ok-t)}
.ans button.ng{background:var(--ng-f);border-color:var(--ng-s);color:var(--ng-t)}
.ans button:disabled{cursor:default}
.ans button:disabled:not(.ok):not(.ng){opacity:.45}
#qres{font-size:14px;margin:8px 0 6px;min-height:22px}
#qnext{width:100%;background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent)}
#cap{font-size:13px;color:var(--text-secondary);margin:2px 0 8px}
svg text{font-family:inherit}
.ts{fill:var(--text-secondary);font-size:12px}
.th{fill:var(--text-primary);font-size:14px;font-weight:500}
.c-coral>circle,.c-coral>rect{fill:var(--coral-f);stroke:var(--coral-s)}.c-coral>text{fill:var(--coral-t)}
.c-purple>circle,.c-purple>rect{fill:var(--purple-f);stroke:var(--purple-s)}.c-purple>text{fill:var(--purple-t)}
.c-blue>circle,.c-blue>rect{fill:var(--blue-f);stroke:var(--blue-s)}.c-blue>text{fill:var(--blue-t)}
.c-gray>circle,.c-gray>rect{fill:var(--gray-f);stroke:var(--gray-s)}.c-gray>text{fill:var(--gray-t)}
.c-lime>circle,.c-lime>rect{fill:var(--lime-f);stroke:var(--lime-s)}.c-lime>text{fill:var(--lime-t)}
circle.c-coral{fill:var(--coral-f);stroke:var(--coral-s)}circle.c-purple{fill:var(--purple-f);stroke:var(--purple-s)}
circle.c-blue{fill:var(--blue-f);stroke:var(--blue-s)}circle.c-gray{fill:var(--gray-f);stroke:var(--gray-s)}circle.c-lime{fill:var(--lime-f);stroke:var(--lime-s)}
</style>
</head>
<body>
<main>
<div class="top"><h1>ダイアトニック指板</h1><button id="qz" aria-pressed="false">キー当てクイズ</button></div>
<div class="row">
<label for="key" style="font-size:14px;color:var(--text-secondary)">キー</label>
<select id="key" style="flex:1"></select>
<span id="keyq">？</span>
<div class="seg" id="scale"><button data-v="maj">メジャー</button><button data-v="min">マイナー</button></div>
</div>
<div class="seg" id="mode"><button data-v="6">6弦ルート</button><button data-v="5">5弦ルート</button></div>
<div class="seg" id="type"><button data-v="3">3和音</button><button data-v="4">4和音（セブンス）</button></div>
<div class="seg" id="lbl"><button data-v="deg">度数表記（Ⅱm）</button><button data-v="name">コード名表記（Dm）</button></div>
<div class="fbhead"><span>← ナット側</span><span class="hint">左右にスクロール</span><span>ブリッジ側 →</span></div>
<div class="fbwrap">
<svg id="lab" width="30" height="216" aria-hidden="true"></svg>
<div class="sc" id="sc"><svg id="fb" height="216" role="img" aria-label="ダイアトニックコードのルート位置を示した横向きの指板（開放弦〜12フレット）"><g id="g"></g></svg></div>
</div>
<div id="quiz">
<div class="qhead"><span id="qq"></span><span class="score" id="qs"></span></div>
<div class="ans" id="ans"></div>
<p id="qres" aria-live="polite"></p>
<button id="qnext">次の問題</button>
</div>
<p id="cap"></p>
<div class="legend" id="legend"></div>
<p class="note">複数タップで同時に強調、もう一度タップで解除</p>
<div class="seg" id="fn"><button data-g="T">T</button><button data-g="SD">SD</button><button data-g="D">D</button><button data-g="clr">すべて解除</button></div>
<div class="chips" id="chips"></div>
</main>
<script>
const OPEN=[4,11,7,2,9,4];
const ABS=[24,19,15,10,5,0];
const LET=['C','D','E','F','G','A','B'],LPC=[0,2,4,5,7,9,11];
const KEYS_MAJ=[['C',0,0],['D♭',1,-1],['D',1,0],['E♭',2,-1],['E',2,0],['F',3,0],['F♯',3,1],['G',4,0],['A♭',5,-1],['A',5,0],['B♭',6,-1],['B',6,0]];
const KEYS_MIN=[['Cm',0,0],['C♯m',0,1],['Dm',1,0],['E♭m',2,-1],['Em',2,0],['Fm',3,0],['F♯m',3,1],['Gm',4,0],['G♯m',4,1],['Am',5,0],['B♭m',6,-1],['Bm',6,0]];
const SC={
maj:{keys:KEYS_MAJ,step:[0,2,4,5,7,9,11],one:'Ⅰ',ex:1,
R3:['Ⅰ','Ⅱm','Ⅲm','Ⅳ','Ⅴ','Ⅵm','Ⅶm-5'],R4:['ⅠM7','Ⅱm7','Ⅲm7','ⅣM7','Ⅴ7','Ⅵm7','Ⅶm7-5'],
C3:['','m','m','','','m','m(♭5)'],C4:['M7','m7','m7','M7','7','m7','m7(♭5)'],
N3:['','m','m','','','m','m-5'],N4:['M7','m7','m7','M7','7','m7','m7-5'],
RF3:['Ⅰ','Ⅱm','Ⅲm','Ⅳ','Ⅴ','Ⅵm','Ⅶm(♭5)'],RF4:['ⅠM7','Ⅱm7','Ⅲm7','ⅣM7','Ⅴ7','Ⅵm7','Ⅶm7(♭5)'],
FN:['T','SD','T','SD','D','T','D'],GRP:{T:[0,2,5],SD:[1,3],D:[4,6]},
cat:['c-coral','c-blue','c-blue','c-purple','c-purple','c-lime','c-gray'],
LG:[['c-coral','Ⅰ（キーのルート）'],['c-purple','メジャーコード（Ⅳ・Ⅴ）'],['c-blue','マイナーコード（Ⅱm・Ⅲm）'],['c-lime','Ⅵm（平行調のルート）'],['c-gray','m(♭5)']]},
min:{keys:KEYS_MIN,step:[0,2,3,5,7,8,10],one:'Ⅰm',ex:3,
R3:['Ⅰm','Ⅱm-5','♭Ⅲ','Ⅳm','Ⅴm','♭Ⅵ','♭Ⅶ'],R4:['Ⅰm7','Ⅱm7-5','♭ⅢM7','Ⅳm7','Ⅴm7','♭ⅥM7','♭Ⅶ7'],
C3:['m','m(♭5)','','m','m','',''],C4:['m7','m7(♭5)','M7','m7','m7','M7','7'],
N3:['m','m-5','','m','m','',''],N4:['m7','m7-5','M7','m7','m7','M7','7'],
RF3:['Ⅰm','Ⅱm(♭5)','♭Ⅲ','Ⅳm','Ⅴm','♭Ⅵ','♭Ⅶ'],RF4:['Ⅰm7','Ⅱm7(♭5)','♭ⅢM7','Ⅳm7','Ⅴm7','♭ⅥM7','♭Ⅶ7'],
FN:['T','SD','T','SD','D','SD','D'],GRP:{T:[0,2],SD:[1,3,5],D:[4,6]},
cat:['c-coral','c-gray','c-lime','c-blue','c-blue','c-purple','c-purple'],
LG:[['c-coral','Ⅰm（キーのルート）'],['c-purple','メジャーコード（♭Ⅵ・♭Ⅶ）'],['c-blue','マイナーコード（Ⅳm・Ⅴm）'],['c-lime','♭Ⅲ（平行調のルート）'],['c-gray','m(♭5)']]}
};
const SKEY='diatonic-fretboard-state';
const st={key:0,scale:'maj',mode:'6',type:'3',lbl:'deg',sel:new Set()};
try{const s=JSON.parse(localStorage.getItem(SKEY)||'null');if(s){if(s.key>=0&&s.key<12)st.key=s.key;if(s.scale==='maj'||s.scale==='min')st.scale=s.scale;if(s.mode==='6'||s.mode==='5')st.mode=s.mode;if(s.type==='3'||s.type==='4')st.type=s.type;if(s.lbl==='deg'||s.lbl==='name')st.lbl=s.lbl;if(Array.isArray(s.sel))st.sel=new Set(s.sel.filter(x=>x>=0&&x<7));}}catch(e){}
function save(){try{localStorage.setItem(SKEY,JSON.stringify({key:st.key,scale:st.scale,mode:st.mode,type:st.type,lbl:st.lbl,sel:[...st.sel]}));}catch(e){}}
const S=()=>SC[st.scale];
const quiz={on:false,picked:-1,n:0,ok:0,prev:0};
function newQ(){let k;do{k=Math.floor(Math.random()*12);}while(k===st.key);st.key=k;quiz.picked=-1;}
const sel=document.getElementById('key');
function fillKeys(){sel.innerHTML='';S().keys.forEach((k,i)=>{const o=document.createElement('option');o.value=i;o.textContent=k[0];sel.appendChild(o);});sel.value=String(st.key);}
fillKeys();
sel.addEventListener('change',()=>{st.key=+sel.value;draw();});
function seg(id,k,cb){const el=document.getElementById(id);el.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.v===st[k]));el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||st[k]===b.dataset.v)return;st[k]=b.dataset.v;el.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));if(cb)cb();draw();});}
seg('scale','scale',()=>{fillKeys();st.sel.clear();if(quiz.on)newQ();});
seg('mode','mode');seg('type','type');seg('lbl','lbl');
document.getElementById('chips').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const s=+b.dataset.s;if(st.sel.has(s))st.sel.delete(s);else st.sel.add(s);draw();});
document.getElementById('fn').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const g=b.dataset.g;if(g==='clr'){st.sel.clear();}else{const m=S().GRP[g];const allOn=m.every(x=>st.sel.has(x));m.forEach(x=>allOn?st.sel.delete(x):st.sel.add(x));}draw();});
const qz=document.getElementById('qz');
qz.addEventListener('click',()=>{if(quiz.on){quiz.on=false;st.key=quiz.prev;sel.value=String(st.key);}else{quiz.on=true;quiz.prev=st.key;quiz.n=0;quiz.ok=0;newQ();window.scrollTo(0,0);}draw();});
document.getElementById('ans').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||quiz.picked>=0)return;quiz.picked=+b.dataset.k;quiz.n++;if(quiz.picked===st.key)quiz.ok++;draw();});
document.getElementById('qnext').addEventListener('click',()=>{newQ();draw();});
function kpc(){const k=S().keys[st.key];return(LPC[k[1]]+k[2]+12)%12;}
function noteName(deg){const k=S().keys[st.key];const l=(k[1]+deg)%7;const t=(kpc()+S().step[deg])%12;let a=t-LPC[l];if(a>6)a-=12;if(a<-6)a+=12;return LET[l]+(a===1?'♯':a===-1?'♭':'');}
let lastView='';
function draw(){
const sc0=S(),four=st.type==='4',byName=!quiz.on&&st.lbl==='name',NS=four?sc0.N4:sc0.N3,RD=four?sc0.R4:sc0.R3;
const cat=d=>sc0.cat[d];
const RL=byName?[0,1,2,3,4,5,6].map(d=>noteName(d)+NS[d]):RD;
const rs=st.mode==='6'?5:4;
const r=((kpc()-OPEN[rs])%12+12)%12;
const start=0,end=12;
const notes=[];
for(let i=0;i<6;i++)for(let f=start;f<=end;f++){const d=ABS[i]+f-(ABS[rs]+r);const m=((d%12)+12)%12;const deg=sc0.step.indexOf(m);if(deg<0)continue;notes.push({i,f,deg,root:m===0});}
const P=6,openW=40,cw=44,first=1,n=end,nut=P+openW,R=nut+n*cw,W=R+8,top=6;
const X=f=>f===0?P+openW/2:nut+(f-first+0.5)*cw;
const Y=i=>top+14+i*30;
const inl=[3,5,7,9,15,17,19,21];
let h='';
h+=`<rect x="${nut}" y="${top}" width="${R-nut}" height="178" fill="var(--bg-neutral)"/>`;
for(let f=first;f<=end;f++){if(inl.includes(f))h+=`<circle cx="${X(f)}" cy="${top+89}" r="4" fill="var(--border-strong)"/>`;if(f===12)h+=`<circle cx="${X(f)}" cy="${top+59}" r="4" fill="var(--border-strong)"/><circle cx="${X(f)}" cy="${top+119}" r="4" fill="var(--border-strong)"/>`;}
for(let k=0;k<=n;k++){const x=nut+k*cw;if(k===0)h+=`<rect x="${x-2.5}" y="${top}" width="5" height="178" fill="var(--text-secondary)"/>`;else h+=`<line x1="${x}" y1="${top}" x2="${x}" y2="${top+178}" stroke="var(--border-stronger)" stroke-width="1"/>`;}
const sw=[0.6,0.8,1,1.3,1.6,2];
let lb='';
for(let i=0;i<6;i++){h+=`<line x1="${P}" y1="${Y(i)}" x2="${R}" y2="${Y(i)}" stroke="var(--text-muted)" stroke-width="${sw[i]}"/>`;lb+=`<text class="ts" x="2" y="${Y(i)}" dominant-baseline="central">${i+1}弦</text>`;}
for(let f=start;f<=end;f++){const strong=inl.includes(f)||f===12;h+=`<text class="${strong?'th':'ts'}" x="${X(f)}" y="${top+196}" text-anchor="middle" dominant-baseline="central" style="font-size:12px">${f===0?'開放':f}</text>`;}
const any=!quiz.on&&st.sel.size>0;
notes.forEach(o=>{const dim=any&&!st.sel.has(o.deg);const cx=X(o.f),cy=Y(o.i);h+=`<g class="pill ${cat(o.deg)}" data-cx="${cx}" data-w="${o.f===0?openW:cw}" opacity="${dim?0.15:1}"><rect x="${cx-12}" y="${cy-11}" width="24" height="22" rx="11" stroke-width="${o.root?2:0.75}"/><text class="th" x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" style="font-size:12px">${RL[o.deg]}</text></g>`;});
const fb=document.getElementById('fb');fb.setAttribute('width',W);fb.setAttribute('viewBox',`0 0 ${W} 216`);
document.getElementById('lab').innerHTML=lb;
document.getElementById('g').innerHTML=h;
document.querySelectorAll('#g g.pill').forEach(g=>{const t=g.querySelector('text'),rc=g.querySelector('rect');const meas=()=>{let w=0;try{w=t.getComputedTextLength();}catch(e){}return w||t.textContent.length*8;};let W=meas()+10;if(W>(+g.dataset.w)-4){t.style.fontSize='11px';t.style.letterSpacing='-0.4px';W=meas()+5;}W=Math.max(24,W);rc.setAttribute('width',W);rc.setAttribute('x',(+g.dataset.cx)-W/2);});
const kn=sc0.keys[st.key][0];
const fl=f=>f===0?'開放':`${f}F`;
const I1=byName?`${sc0.one}（${noteName(0)}）`:sc0.one;
let cap=`キー${kn}：${rs+1}弦${r===0?'開放・12F':fl(r)}＝${I1}`;
const oc=[[rs-1,r+2],[rs,r+7]].filter(x=>x[1]<=12).map(x=>`${x[0]}弦${fl(x[1])}`);
if(oc.length)cap+=`。オクターブ上の${sc0.one}は${oc.join('と')}`;
document.getElementById('cap').textContent=cap;
const view=st.key+'-'+st.mode+'-'+st.scale;
if(view!==lastView){lastView=view;const sc=document.getElementById('sc');sc.scrollLeft=r<=1?0:Math.max(0,X(r-1)-cw/2-4);}
const RF=four?sc0.RF4:sc0.RF3,CQ=four?sc0.C4:sc0.C3,FN=sc0.FN,GRP=sc0.GRP;
document.getElementById('chips').innerHTML=[0,1,2,3,4,5,6].map(d=>`<button class="chip${st.sel.has(d)?' on':''}${d===6?' wide':''}" data-s="${d}" aria-pressed="${st.sel.has(d)}"><svg width="12" height="12" aria-hidden="true"><circle class="${cat(d)}" cx="6" cy="6" r="5" stroke-width="1"/></svg><span style="font-weight:500;white-space:nowrap">${RF[d]}</span><span style="white-space:nowrap">${noteName(d)}${CQ[d]}</span><span style="margin-left:auto;color:var(--text-muted);font-size:12px">${FN[d]}</span></button>`).join('');
document.querySelectorAll('#fn button').forEach(b=>{const g=b.dataset.g;b.classList.toggle('on',g!=='clr'&&GRP[g].every(x=>st.sel.has(x)));});
const lb2=document.querySelectorAll('#lbl button');lb2[0].textContent=`度数表記（${RD[sc0.ex]}）`;lb2[1].textContent=`コード名表記（${noteName(sc0.ex)}${NS[sc0.ex]}）`;
document.getElementById('legend').innerHTML=sc0.LG.map(x=>`<span><svg width="12" height="12" aria-hidden="true"><circle class="${x[0]}" cx="6" cy="6" r="5" stroke-width="1"/></svg>${x[1]}</span>`).join('');
document.body.classList.toggle('quiz',quiz.on);
qz.textContent=quiz.on?'クイズ終了':'キー当てクイズ';qz.classList.toggle('on',quiz.on);qz.setAttribute('aria-pressed',quiz.on);
if(quiz.on){
const done=quiz.picked>=0,hit=quiz.picked===st.key;
document.getElementById('keyq').textContent=done?kn:'？';
document.getElementById('qq').textContent=done?`第${quiz.n}問の答え`:`第${quiz.n+1}問：この指板のキーは？`;
document.getElementById('qs').textContent=`正解 ${quiz.ok} / ${quiz.n} 問`;
document.getElementById('ans').innerHTML=sc0.keys.map((k,i)=>`<button data-k="${i}"${done?' disabled':''} class="${done&&i===st.key?'ok':done&&i===quiz.picked?'ng':''}">${k[0]}</button>`).join('');
document.getElementById('qres').textContent=done?`${hit?'正解です。':`不正解です。正解は ${kn} です。`}${cap}`:`ヒント：${sc0.one} の丸がある弦とフレットを見てください`;
document.getElementById('qnext').style.display=done?'':'none';
}
if(!quiz.on)save();
}
draw();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
